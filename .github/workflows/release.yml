name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows package (portable zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # First, before the ~20-minute build: the address is baked into the
      # installer, so a release built without one produces an app that
      # reaches nothing. It is a repository VARIABLE, not a secret - the
      # address of a server is public, it is printed in the app's own UI and
      # start-up log, and a secret here would only make it harder to see
      # which server a release was built for.
      # Set it at Settings -> Secrets and variables -> Actions -> Variables.
      - name: Check the coordination server address is configured
        env:
          SIGNFLOW_SERVER_URL: ${{ vars.SIGNFLOW_SERVER_URL }}
        run: |
          if [ -z "$SIGNFLOW_SERVER_URL" ]; then
            echo "::error::The repository variable SIGNFLOW_SERVER_URL is not set."
            echo "::error::Set it to the coordination server this release is for,"
            echo "::error::e.g. https://signflow.example.com (https, host and"
            echo "::error::optional port only - no path, no trailing slash), under"
            echo "::error::Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "Coordination server for this release: $SIGNFLOW_SERVER_URL"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up packaging JDK 26.0.2 (the exact release the WiX template was authored against)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Pinned EXACTLY: packaging/windows/main.wxs tracks this JDK's
          # jpackage template. A patch-version drift trips the template
          # drift check, and a major drift (26 -> anything else) breaks
          # WiX link time outright. See docs/windows-packaging.md.
          java-version: '26.0.2'
          cache: maven

      - name: Install WiX toolset (for MSI)
        run: choco install wixtoolset -y --no-progress

      - name: Verify WiX 3.14.1 is discoverable (fail before the ~20-minute build)
        run: |
          # WiX installs to the 32-bit Program Files root on the runner;
          # scripts/package-windows.sh scans exactly these roots.
          wix_bin=""
          for d in "/c/Program Files (x86)/WiX Toolset"*/bin "/c/Program Files/WiX Toolset"*/bin; do
            if [ -x "$d/candle.exe" ]; then wix_bin="$d"; break; fi
          done
          if [ -z "$wix_bin" ]; then
            echo "::error::candle.exe not found in the WiX Toolset install roots"
            exit 1
          fi
          if ! "$wix_bin/candle.exe" -? 2>&1 | grep -q "version 3.14.1"; then
            echo "::error::$wix_bin/candle.exe is not WiX 3.14.1 - the pinned pairing is WiX 3.14.1 + packaging JDK 26.0.2 (docs/windows-packaging.md)"
            exit 1
          fi
          echo "WiX verified at $wix_bin: $("$wix_bin/candle.exe" -? 2>&1 | head -n 1)"

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Package (jpackage, reuses the jar built above)
        env:
          SIGNFLOW_SERVER_URL: ${{ vars.SIGNFLOW_SERVER_URL }}
        run: |
          # The pinned wrapper: locates the 26.0.2 packaging JDK (setup-java's
          # JAVA_HOME) and WiX 3.14.1, runs scripts/package.sh --skip-build,
          # then verifies MSI + zip + checksums exist and agree.
          bash scripts/package-windows.sh --skip-build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SignFlow-windows
          path: |
            build/dist/SignFlow-*-windows.zip
            build/dist/*.msi
            build/dist/*.sha256
            build/dist/release-manifest.json
          if-no-files-found: error

      - name: Attach zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/SignFlow-*-windows.zip
            build/dist/*.msi
            build/dist/*.sha256
            build/dist/release-manifest.json
          generate_release_notes: true
